<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DRIVE 3D</title>
<style>
:root{--cyan:#00eaff;--pink:#ff35c8;--bg:#050812}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:var(--bg);color:#fff;font-family:Arial, sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:20px}
.brand{font-weight:900;letter-spacing:4px;font-size:clamp(18px,3vw,30px);text-shadow:0 0 15px var(--cyan)}
.brand span{color:var(--cyan)}
.panel{position:absolute;top:20px;right:20px;text-align:right;background:#071321b8;border:1px solid #00eaff66;border-radius:14px;padding:12px 18px;box-shadow:0 0 25px #00eaff22}
.stat{font-size:13px;color:#9bb4c8;letter-spacing:2px}.value{font-size:25px;font-weight:bold;color:var(--cyan)}
#message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;width:min(90%,560px);background:#050812e8;border:1px solid #00eaff88;border-radius:20px;padding:28px;box-shadow:0 0 45px #00eaff22}
#message h1{font-size:clamp(28px,6vw,48px);margin:0 0 10px;letter-spacing:5px;text-shadow:0 0 20px var(--cyan)}
#message p{color:#b8c9d8;line-height:1.6}
button{pointer-events:auto;border:0;border-radius:10px;padding:13px 24px;background:linear-gradient(90deg,#00c8e8,#7657ff);color:white;font-weight:800;letter-spacing:1px;cursor:pointer}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 24px;pointer-events:none}
.pad{display:flex;gap:12px}
.control{pointer-events:auto;width:64px;height:58px;border:1px solid #00eaff88;background:#061525bb;color:#fff;border-radius:14px;font-size:24px;touch-action:none;box-shadow:0 0 18px #00eaff22}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#8ba2b6;letter-spacing:1px;white-space:nowrap}
@media(max-width:600px){#hud{padding:14px}.panel{top:65px;right:14px}.control{width:58px;height:54px}#hint{display:none}}
</style>
</head>
<body>
<div id="hud">
  <div class="brand">NEON<span> DRIVE</span> <small style="font-size:11px;color:#9bb4c8">3D</small></div>
  <div class="panel"><div class="stat">SCORE</div><div class="value" id="score">00000</div><div class="stat" style="margin-top:8px">SPEED <b id="speed" style="color:#fff">0</b> KM/H</div></div>
  <div id="message">
    <h1>NEON DRIVE</h1>
    <p>Neon shaharda haydang, boshqa mashinalardan qoching va imkon qadar ko‘p ball to‘plang.</p>
    <p><b>W A S D</b> yoki <b>← ↑ ↓ →</b> tugmalari bilan boshqaring.</p>
    <button id="start">O‘YINNI BOSHLASH</button>
  </div>
</div>
<div id="controls">
  <div class="pad"><button class="control" data-key="ArrowLeft">◀</button><button class="control" data-key="ArrowRight">▶</button></div>
  <div class="pad"><button class="control" data-key="ArrowDown">▼</button><button class="control" data-key="ArrowUp">▲</button></div>
</div>
<div id="hint">WASD / ARROW KEYS — DRIVE</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050812);
scene.fog = new THREE.Fog(0x050812, 28, 145);
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, .1, 220);
camera.position.set(0, 7.2, 12);
camera.lookAt(0, 0, -8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9bbcff,0x101020,2));
const moon = new THREE.DirectionalLight(0x8bdfff,2.2);
moon.position.set(-8,15,8); moon.castShadow=true; scene.add(moon);

const mat=(color,emissive=0x000000,intensity=0)=>new THREE.MeshStandardMaterial({color,metalness:.55,roughness:.32,emissive,emissiveIntensity:intensity});
const roadMat=mat(0x101827);
const road=new THREE.Mesh(new THREE.PlaneGeometry(15,220),roadMat);
road.rotation.x=-Math.PI/2; road.position.z=-75; road.receiveShadow=true; scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,240),mat(0x070b16));
ground.rotation.x=-Math.PI/2; ground.position.set(0,-.12,-75); scene.add(ground);

const cyan=mat(0x00dfff,0x00bfff,2.2), pink=mat(0xff32c8,0xff00aa,1.8), white=mat(0xbfeeff,0x6bcfff,.7);
for(const x of [-7.45,7.45]){
 const line=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,220),cyan);line.position.set(x,.06,-75);scene.add(line);
}
const laneMarks=[];
for(let z=10;z>-190;z-=9){
 for(const x of [-2.5,2.5]){
  const m=new THREE.Mesh(new THREE.BoxGeometry(.09,.035,4),white);
  m.position.set(x,.04,z);scene.add(m);laneMarks.push(m);
 }
}
function makeCar(color=0x00bde8){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.65,.48,3.15),mat(color,color,.35));
 body.position.y=.65;body.castShadow=true;g.add(body);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.22,.58,1.45),mat(0x101c32,0x07182a,.2));
 cabin.position.set(0,1.12,-.15);g.add(cabin);
 const glass=new THREE.Mesh(new THREE.BoxGeometry(1.08,.38,.06),mat(0x4ceaff,0x007caa,.6));
 glass.position.set(0,1.17,.59);g.add(glass);
 for(const x of [-.87,.87])for(const z of [-1,1]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.18,16),mat(0x080a10));
  w.rotation.z=Math.PI/2;w.position.set(x,.38,z);g.add(w);
 }
 const glow=new THREE.PointLight(color,1.6,5);glow.position.set(0,.5,0);g.add(glow);
 for(const x of [-.52,.52]){
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(.28,.12,.05),white);lamp.position.set(x,.7,1.59);g.add(lamp);
 }
 return g;
}
const player=makeCar(0x00cfff);player.position.set(0,0,5);scene.add(player);
const traffic=[];
function spawnTraffic(z=-100){
 const colors=[0xff287d,0xffa52e,0x9b6bff,0x42ffad];
 const car=makeCar(colors[Math.floor(Math.random()*colors.length)]);
 const lane=[-5,0,5][Math.floor(Math.random()*3)];
 car.position.set(lane,0,z);scene.add(car);traffic.push(car);
}
for(let i=0;i<5;i++)spawnTraffic(-35-i*28);

const buildings=[];
for(const side of [-1,1]){
 for(let i=0;i<24;i++){
  const h=5+Math.random()*19,w=3+Math.random()*4;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,5+Math.random()*5),mat(0x101a30,0x07162c,.5));
  b.position.set(side*(12+Math.random()*12),h/2,-i*9-5);scene.add(b);
  const sign=new THREE.Mesh(new THREE.BoxGeometry(.08,h*.65,.15),i%2?pink:cyan);
  sign.position.set(side*(12+Math.random()*12),h*.48,b.position.z+2.56);scene.add(sign);
  buildings.push({b,sign});
 }
}
const starsGeo=new THREE.BufferGeometry(), starPositions=[];
for(let i=0;i<500;i++)starPositions.push((Math.random()-.5)*180,10+Math.random()*80,-Math.random()*220);
starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0x9edfff,size:.22})));

const keys={};let running=false,score=0,speed=0,spawnTimer=0,last=0;
const scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),message=document.getElementById('message');
function setKey(k,v){keys[k]=v}
addEventListener('keydown',e=>{setKey(e.key.toLowerCase(),true);setKey(e.key,true);if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();});
addEventListener('keyup',e=>{setKey(e.key.toLowerCase(),false);setKey(e.key,false);});
document.querySelectorAll('.control').forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();setKey(k,true)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>setKey(k,false)));
});
function endGame(){
 running=false;
 message.style.display='block';
 message.innerHTML=`<h1>GAME OVER</h1><p>Natijangiz: <b style="color:#00eaff">${Math.floor(score)}</b> ball</p><button id="start">QAYTA BOSHLASH</button>`;
 document.getElementById('start').onclick=startGame;
}
function startGame(){
 score=0;speed=0;spawnTimer=0;player.position.x=0;
 traffic.forEach((c,i)=>c.position.set([-5,0,5][i%3],0,-40-i*30));
 scoreEl.textContent='00000';speedEl.textContent='0';
 message.style.display='none';running=true;last=performance.now();
}
document.getElementById('start').onclick=startGame;

function animate(t){
 requestAnimationFrame(animate);
 const dt=Math.min((t-last)/1000,.04);last=t;
 if(running){
  speed=Math.min(190,speed+28*dt);
  const steer=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0);
  player.position.x=THREE.MathUtils.clamp(player.position.x+steer*9*dt,-5.4,5.4);
  player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-steer*.12,7,dt);
  if(keys.ArrowUp||keys.w)speed=Math.min(240,speed+75*dt);
  if(keys.ArrowDown||keys.s)speed=Math.max(65,speed-120*dt);
  const move=(speed/100)*24*dt;
  laneMarks.forEach(m=>{m.position.z+=move;if(m.position.z>14)m.position.z-=198});
  buildings.forEach(o=>{o.b.position.z+=move*.8;o.sign.position.z+=move*.8;if(o.b.position.z>20){o.b.position.z-=216;o.sign.position.z-=216}});
  spawnTimer+=dt;
  if(spawnTimer>Math.max(.65,1.5-speed/260)){spawnTraffic(-145);spawnTimer=0}
  traffic.forEach(c=>{
   c.position.z+=move;
   if(c.position.z>14){c.position.z=-145-Math.random()*30;c.position.x=[-5,0,5][Math.floor(Math.random()*3)];score+=10}
   if(Math.abs(c.position.z-player.position.z)<2.3&&Math.abs(c.position.x-player.position.x)<1.35)endGame();
  });
  score+=dt*speed*.35;
  scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');
  speedEl.textContent=String(Math.floor(speed));
 }
 camera.position.x=THREE.MathUtils.damp(camera.position.x,player.position.x*.24,3,1/60);
 camera.lookAt(player.position.x*.18,.2,-8);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
